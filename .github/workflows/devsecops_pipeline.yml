name: devsecops pipeline

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

permissions:
  contents: read
  security-events: write   # upload SARIF to GitHub Security tab
  packages: write          # push image to GHCR

jobs:

  # ══════════════════════════════════════════════════════
  # JOB 1 — Secret scanning
  # ══════════════════════════════════════════════════════
  gitleaks:
    name: Scan for secrets
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4       # fixed: v6 does not exist
        with:
          fetch-depth: 0                # full history so gitleaks scans all commits

      - name: Run Gitleaks
        uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  # ══════════════════════════════════════════════════════
  # JOB 2 — Mutation tests
  # ══════════════════════════════════════════════════════
  mutation-test:
    name: Run mutation tests
    runs-on: ubuntu-latest
    needs: gitleaks
    steps:
      - name: Checkout code
        uses: actions/checkout@v4       # fixed: v6 does not exist

      - name: Setup Java
        uses: actions/setup-java@v4     # fixed: pinned to latest stable
        with:
          distribution: zulu
          java-version: '11'

      - name: Build project
        run: mvn clean package -DskipTests

      - name: Run mutation tests
        run: mvn org.pitest:pitest-maven:mutationCoverage

  # ══════════════════════════════════════════════════════
  # JOB 3 — SAST + SCA (Snyk)
  # ══════════════════════════════════════════════════════
  sast-and-sca-scan:
    name: SAST and SCA scans (Snyk)
    runs-on: ubuntu-latest
    needs: gitleaks
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Verify SNYK_TOKEN is set
        run: |
          if [ -z "${{ secrets.SNYK_TOKEN }}" ]; then
            echo "❌ SNYK_TOKEN is NOT set"
            exit 1
          fi
          echo "✅ SNYK_TOKEN is set"

      - name: Run Snyk SCA (dependency scan)
        uses: snyk/actions/maven-3-jdk-11@master
        env:
          SNYK_TOKEN: ${{ secrets.SNYK_TOKEN }}
        with:
          command: test
          args: --sarif-file-output=snyk-sca.sarif
        continue-on-error: true

      - name: Run Snyk SAST (code scan)
        uses: snyk/actions/maven-3-jdk-11@master
        env:
          SNYK_TOKEN: ${{ secrets.SNYK_TOKEN }}
        with:
          command: code test
          args: --sarif-file-output=snyk-sast.sarif
        continue-on-error: true

      - name: Upload Snyk SARIF results to Security tab
        uses: github/codeql-action/upload-sarif@v3
        if: always()
        with:
          sarif_file: .

  # ══════════════════════════════════════════════════════
  # JOB 4 — Lint Dockerfile, build image, Trivy image scan
  #          Exposes image tag via job output so downstream
  #          jobs reuse the same built image (no rebuild).
  # ══════════════════════════════════════════════════════
  build-and-scan-image:
    name: Build image and scan
    runs-on: ubuntu-latest
    needs: gitleaks

    # ── Expose the image tag to every job that needs: this job ──────────
    outputs:
      image-tag: ${{ steps.meta.outputs.tags }}

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      # ── Lint Dockerfile ──────────────────────────────────────────────
      - name: Lint Dockerfile (Hadolint)
        uses: hadolint/hadolint-action@v3.1.0
        with:
          dockerfile: Dockerfile

      # ── Build WAR so Docker build context is complete ────────────────
      - name: Build WAR (Maven)
        uses: actions/setup-java@v4
        with:
          distribution: zulu
          java-version: '11'

      - run: mvn clean package -DskipTests

      # ── Resolve image tag ────────────────────────────────────────────
      - name: Docker metadata
        id: meta                        # referenced in outputs above
        uses: docker/metadata-action@v5
        with:
          images: calculator-webapp
          tags: |
            type=sha,format=short

      # ── Build image (local only, push: false) ────────────────────────
      - name: Build Docker image
        uses: docker/build-push-action@v6
        with:
          context: .
          push: false
          tags: ${{ steps.meta.outputs.tags }}

      # ── Trivy image scan ─────────────────────────────────────────────
      - name: Trivy — image vulnerability scan
        uses: aquasecurity/trivy-action@master
        with:
          image-ref: ${{ steps.meta.outputs.tags }}
          format: table
          exit-code: '1'
          ignore-unfixed: true
          vuln-type: os,library
          severity: CRITICAL,HIGH

  # ══════════════════════════════════════════════════════
  # JOB 5 — DAST scan (OWASP ZAP)
  #          Rebuilds from the same sha tag so the image
  #          is identical to what was scanned above.
  # ══════════════════════════════════════════════════════
  dast-scan:
    name: DAST scan (OWASP ZAP)
    runs-on: ubuntu-latest
    needs: build-and-scan-image         # wait for image scan to pass first

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: zulu
          java-version: '11'

      - name: Build WAR (Maven)
        run: mvn clean package -DskipTests

      # ── Resolve same image tag used in build job ─────────────────────
      - name: Docker metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: calculator-webapp
          tags: |
            type=sha,format=short

      - name: Build Docker image
        uses: docker/build-push-action@v6
        with:
          context: .
          push: false
          tags: ${{ steps.meta.outputs.tags }}

      - name: Start application container
        run: |
          docker run -d \
            --name calc-container \
            -p 8081:8080 \
            ${{ steps.meta.outputs.tags }}
          echo "Waiting for app to start..."
          sleep 15

      - name: Prepare ZAP working directory
        run: |
          mkdir -p report
          cp DevSecOps-Pipeline/zap-rules.conf report/
          chmod -R 777 report

      - name: Run OWASP ZAP baseline scan
        run: |
          docker run --rm \
            -v ${{ github.workspace }}/report:/zap/wrk/:rw \
            --network host \
            zaproxy/zap-stable \
            zap-baseline.py \
            -t http://localhost:8081 \
            -c zap-rules.conf \
            -r zap-report.html

      - name: Stop application container
        if: always()
        run: |
          docker stop calc-container || true
          docker rm calc-container   || true

      - name: Upload ZAP report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: zap-dast-report
          path: report/

  # ══════════════════════════════════════════════════════
  # JOB 6 — SBOM: generate with Syft, scan with Grype + Trivy
  #
  #   Flow:
  #     Syft (image + source)
  #       └─ sbom.spdx.json  ──► Grype scan  ──► SARIF → Security tab
  #       └─ sbom.cdx.json   ──► Trivy scan  ──► SARIF → Security tab
  # ══════════════════════════════════════════════════════
  sbom-scan:
    name: SBOM scan (Syft → Grype + Trivy)
    runs-on: ubuntu-latest
    needs: build-and-scan-image
 
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
 
      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: zulu
          java-version: '11'
 
      - name: Build WAR (Maven)
        run: mvn clean package -DskipTests
 
      - name: Docker metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: calculator-webapp
          tags: |
            type=sha,format=short
 
      - name: Build Docker image
        uses: docker/build-push-action@v6
        with:
          context: .
          push: false
          tags: ${{ steps.meta.outputs.tags }}
 
      # ─────────────────────────────────────────
      # STEP A — Generate SBOM with Syft
      # ─────────────────────────────────────────
 
      - name: Install Syft
        uses: anchore/sbom-action/download-syft@v0
 
      - name: Syft — SBOM from image (SPDX JSON)
        run: |
          syft ${{ steps.meta.outputs.tags }} \
            --output spdx-json=sbom.spdx.json
          echo "✅ sbom.spdx.json generated"
          jq '.packages | length' sbom.spdx.json
 
      - name: Syft — SBOM from source tree (SPDX JSON)
        run: |
          syft dir:. \
            --output spdx-json=sbom-src.spdx.json
          echo "✅ sbom-src.spdx.json generated"
          jq '.packages | length' sbom-src.spdx.json
 
      - name: Syft — convert image SBOM to CycloneDX
        run: |
          syft convert sbom.spdx.json \
            --output cyclonedx-json=sbom.cdx.json
          echo "✅ sbom.cdx.json generated"
 
      - name: SBOM summary
        run: |
          PKGS=$(jq '.packages | length' sbom.spdx.json)
          echo "## SBOM Summary" >> "$GITHUB_STEP_SUMMARY"
          echo "| | |" >> "$GITHUB_STEP_SUMMARY"
          echo "|---|---|" >> "$GITHUB_STEP_SUMMARY"
          echo "| Image | \`${{ steps.meta.outputs.tags }}\` |" >> "$GITHUB_STEP_SUMMARY"
          echo "| Packages found | **$PKGS** |" >> "$GITHUB_STEP_SUMMARY"
          echo "| Formats | spdx-json, cyclonedx-json |" >> "$GITHUB_STEP_SUMMARY"
 
      # ─────────────────────────────────────────
      # STEP B — Scan with Grype (CLI, not action)
      #
      # Root cause of "Unexpected end of JSON input":
      # anchore/scan-action writes SARIF via its own
      # wrapper which outputs an empty/partial file
      # when there are 0 findings at the cutoff level.
      # Running Grype CLI directly gives us full control.
      # ─────────────────────────────────────────
 
      - name: Install Grype
        run: |
          curl -sSfL \
            https://raw.githubusercontent.com/anchore/grype/main/install.sh \
            | sh -s -- -b /usr/local/bin
          grype version
 
      - name: Grype — scan SBOM → SARIF
        # exit-code 0: don't stop here, validate first, gate runs last
        run: |
          grype sbom:sbom.spdx.json \
            --output sarif \
            --file grype.sarif \
            --exit-code 0
 
      - name: Grype — validate SARIF before upload
        # Catches the "Unexpected end of JSON input" error proactively
        run: |
          if [ ! -f grype.sarif ]; then
            echo "❌ grype.sarif was not created"
            exit 1
          fi
          if [ ! -s grype.sarif ]; then
            echo "❌ grype.sarif is empty — writing minimal valid SARIF"
            # Write a valid empty SARIF so upload doesn't fail
            cat > grype.sarif <<'EOF'
          {
            "$schema": "https://json.schemastore.org/sarif-2.1.0.json",
            "version": "2.1.0",
            "runs": [{ "tool": { "driver": { "name": "grype", "rules": [] } }, "results": [] }]
          }
          EOF
          fi
          jq empty grype.sarif && echo "✅ grype.sarif is valid JSON"
          COUNT=$(jq '.runs[0].results | length' grype.sarif)
          echo "Grype findings: $COUNT"
          echo "Grype findings: **$COUNT**" >> "$GITHUB_STEP_SUMMARY"
 
      - name: Grype — table report (job summary)
        run: |
          grype sbom:sbom.spdx.json \
            --output table \
            --file grype-table.txt \
            --exit-code 0
 
          echo "## Grype Scan Results" >> "$GITHUB_STEP_SUMMARY"
          echo '```' >> "$GITHUB_STEP_SUMMARY"
          cat grype-table.txt >> "$GITHUB_STEP_SUMMARY"
          echo '```' >> "$GITHUB_STEP_SUMMARY"
 
      - name: Grype — upload SARIF to Security tab
        uses: github/codeql-action/upload-sarif@v4
        if: always()
        with:
          sarif_file: grype.sarif
          category: grype-sbom
 
      - name: Grype — severity gate (fail on HIGH+)
        run: |
          grype sbom:sbom.spdx.json \
            --output table \
            --fail-on high
 
      # ─────────────────────────────────────────
      # STEP C — Scan with Trivy (CLI install)
      #
      # Root cause of "Path does not exist: trivy-sbom.sarif":
      # aquasecurity/setup-trivy + separate scan step can
      # fail silently leaving no output file. Installing
      # Trivy via apt and running CLI directly is explicit
      # and the file path is always predictable.
      # ─────────────────────────────────────────
 
      - name: Install Trivy
        run: |
          sudo apt-get install -y wget apt-transport-https gnupg
          wget -qO - \
            https://aquasecurity.github.io/trivy-repo/deb/public.key \
            | gpg --dearmor \
            | sudo tee /usr/share/keyrings/trivy.gpg > /dev/null
          echo "deb [signed-by=/usr/share/keyrings/trivy.gpg] \
            https://aquasecurity.github.io/trivy-repo/deb generic main" \
            | sudo tee /etc/apt/sources.list.d/trivy.list
          sudo apt-get update -qq
          sudo apt-get install -y trivy
          trivy --version
 
      - name: Trivy — scan SPDX SBOM → SARIF
        run: |
          trivy sbom \
            --format sarif \
            --output trivy-sbom.sarif \
            --severity CRITICAL,HIGH,MEDIUM \
            --exit-code 0 \
            sbom.spdx.json
 
      - name: Trivy — validate SARIF before upload
        # Same defensive check as Grype — catches missing/empty file
        run: |
          if [ ! -f trivy-sbom.sarif ]; then
            echo "❌ trivy-sbom.sarif was not created"
            exit 1
          fi
          if [ ! -s trivy-sbom.sarif ]; then
            echo "⚠️ trivy-sbom.sarif is empty — writing minimal valid SARIF"
            cat > trivy-sbom.sarif <<'EOF'
          {
            "$schema": "https://json.schemastore.org/sarif-2.1.0.json",
            "version": "2.1.0",
            "runs": [{ "tool": { "driver": { "name": "trivy", "rules": [] } }, "results": [] }]
          }
          EOF
          fi
          jq empty trivy-sbom.sarif && echo "✅ trivy-sbom.sarif is valid JSON"
          COUNT=$(jq '.runs[0].results | length' trivy-sbom.sarif)
          echo "Trivy findings: $COUNT"
          echo "Trivy findings: **$COUNT**" >> "$GITHUB_STEP_SUMMARY"
 
      - name: Trivy — scan CycloneDX SBOM → JSON
        run: |
          trivy sbom \
            --format json \
            --output trivy-cdx.json \
            --severity CRITICAL,HIGH,MEDIUM \
            --exit-code 0 \
            sbom.cdx.json
 
      - name: Trivy — table report (job summary)
        run: |
          trivy sbom \
            --format table \
            --severity CRITICAL,HIGH,MEDIUM \
            --exit-code 0 \
            sbom.spdx.json | tee trivy-table.txt
 
          echo "## Trivy Scan Results" >> "$GITHUB_STEP_SUMMARY"
          echo '```' >> "$GITHUB_STEP_SUMMARY"
          cat trivy-table.txt >> "$GITHUB_STEP_SUMMARY"
          echo '```' >> "$GITHUB_STEP_SUMMARY"
 
      - name: Trivy — upload SARIF to Security tab
        uses: github/codeql-action/upload-sarif@v4
        if: always()
        with:
          sarif_file: trivy-sbom.sarif
          category: trivy-sbom
 
      - name: Trivy — severity gate (fail on CRITICAL/HIGH)
        run: |
          trivy sbom \
            --format table \
            --severity CRITICAL,HIGH \
            --exit-code 1 \
            sbom.spdx.json
 
      # ─────────────────────────────────────────
      # STEP D — Upload all reports
      # ─────────────────────────────────────────
      - name: Upload SBOM and scan reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: sbom-and-scan-reports
          retention-days: 30
          path: |
            sbom.spdx.json
            sbom-src.spdx.json
            sbom.cdx.json
            grype.sarif
            grype-table.txt
            trivy-sbom.sarif
            trivy-cdx.json
            trivy-table.txt
 