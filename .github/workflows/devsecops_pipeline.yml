name: devsecops pipeline

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

permissions:
  contents: read
  security-events: write   # upload SARIF to GitHub Security tab
  packages: write          # push image to GHCR

jobs:

  # ══════════════════════════════════════════════════════
  # JOB 1 — Secret scanning
  # ══════════════════════════════════════════════════════
  gitleaks:
    name: Scan for secrets
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4       # fixed: v6 does not exist
        with:
          fetch-depth: 0                # full history so gitleaks scans all commits

      - name: Run Gitleaks
        uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  # ══════════════════════════════════════════════════════
  # JOB 2 — Mutation tests
  # ══════════════════════════════════════════════════════
  mutation-test:
    name: Run mutation tests
    runs-on: ubuntu-latest
    needs: gitleaks
    steps:
      - name: Checkout code
        uses: actions/checkout@v4       # fixed: v6 does not exist

      - name: Setup Java
        uses: actions/setup-java@v4     # fixed: pinned to latest stable
        with:
          distribution: zulu
          java-version: '11'

      - name: Build project
        run: mvn clean package -DskipTests

      - name: Run mutation tests
        run: mvn org.pitest:pitest-maven:mutationCoverage

  # ══════════════════════════════════════════════════════
  # JOB 3 — SAST + SCA (Snyk)
  # ══════════════════════════════════════════════════════
  sast-and-sca-scan:
    name: SAST and SCA scans (Snyk)
    runs-on: ubuntu-latest
    needs: gitleaks
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Verify SNYK_TOKEN is set
        run: |
          if [ -z "${{ secrets.SNYK_TOKEN }}" ]; then
            echo "❌ SNYK_TOKEN is NOT set"
            exit 1
          fi
          echo "✅ SNYK_TOKEN is set"

      - name: Run Snyk SCA (dependency scan)
        uses: snyk/actions/maven-3-jdk-11@master
        env:
          SNYK_TOKEN: ${{ secrets.SNYK_TOKEN }}
        with:
          command: test
          args: --sarif-file-output=snyk-sca.sarif
        continue-on-error: true

      - name: Run Snyk SAST (code scan)
        uses: snyk/actions/maven-3-jdk-11@master
        env:
          SNYK_TOKEN: ${{ secrets.SNYK_TOKEN }}
        with:
          command: code test
          args: --sarif-file-output=snyk-sast.sarif
        continue-on-error: true

      - name: Upload Snyk SARIF results to Security tab
        uses: github/codeql-action/upload-sarif@v3
        if: always()
        with:
          sarif_file: .

  # ══════════════════════════════════════════════════════
  # JOB 4 — Lint Dockerfile, build image, Trivy image scan
  #          Exposes image tag via job output so downstream
  #          jobs reuse the same built image (no rebuild).
  # ══════════════════════════════════════════════════════
  build-and-scan-image:
    name: Build image and scan
    runs-on: ubuntu-latest
    needs: gitleaks

    # ── Expose the image tag to every job that needs: this job ──────────
    outputs:
      image-tag: ${{ steps.meta.outputs.tags }}

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      # ── Lint Dockerfile ──────────────────────────────────────────────
      - name: Lint Dockerfile (Hadolint)
        uses: hadolint/hadolint-action@v3.1.0
        with:
          dockerfile: Dockerfile

      # ── Build WAR so Docker build context is complete ────────────────
      - name: Build WAR (Maven)
        uses: actions/setup-java@v4
        with:
          distribution: zulu
          java-version: '11'

      - run: mvn clean package -DskipTests

      # ── Resolve image tag ────────────────────────────────────────────
      - name: Docker metadata
        id: meta                        # referenced in outputs above
        uses: docker/metadata-action@v5
        with:
          images: calculator-webapp
          tags: |
            type=sha,format=short

      # ── Build image (local only, push: false) ────────────────────────
      - name: Build Docker image
        uses: docker/build-push-action@v6
        with:
          context: .
          push: false
          tags: ${{ steps.meta.outputs.tags }}

      # ── Trivy image scan ─────────────────────────────────────────────
      - name: Trivy — image vulnerability scan
        uses: aquasecurity/trivy-action@master
        with:
          image-ref: ${{ steps.meta.outputs.tags }}
          format: table
          exit-code: '1'
          ignore-unfixed: true
          vuln-type: os,library
          severity: CRITICAL,HIGH

  # ══════════════════════════════════════════════════════
  # JOB 5 — DAST scan (OWASP ZAP)
  #          Rebuilds from the same sha tag so the image
  #          is identical to what was scanned above.
  # ══════════════════════════════════════════════════════
  dast-scan:
    name: DAST scan (OWASP ZAP)
    runs-on: ubuntu-latest
    needs: build-and-scan-image         # wait for image scan to pass first

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: zulu
          java-version: '11'

      - name: Build WAR (Maven)
        run: mvn clean package -DskipTests

      # ── Resolve same image tag used in build job ─────────────────────
      - name: Docker metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: calculator-webapp
          tags: |
            type=sha,format=short

      - name: Build Docker image
        uses: docker/build-push-action@v6
        with:
          context: .
          push: false
          tags: ${{ steps.meta.outputs.tags }}

      - name: Start application container
        run: |
          docker run -d \
            --name calc-container \
            -p 8081:8080 \
            ${{ steps.meta.outputs.tags }}
          echo "Waiting for app to start..."
          sleep 15

      - name: Prepare ZAP working directory
        run: |
          mkdir -p report
          cp DevSecOps-Pipeline/zap-rules.conf report/
          chmod -R 777 report

      - name: Run OWASP ZAP baseline scan
        run: |
          docker run --rm \
            -v ${{ github.workspace }}/report:/zap/wrk/:rw \
            --network host \
            zaproxy/zap-stable \
            zap-baseline.py \
            -t http://localhost:8081 \
            -c zap-rules.conf \
            -r zap-report.html

      - name: Stop application container
        if: always()
        run: |
          docker stop calc-container || true
          docker rm calc-container   || true

      - name: Upload ZAP report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: zap-dast-report
          path: report/

  # ══════════════════════════════════════════════════════
  # JOB 6 — SBOM: generate with Syft, scan with Grype + Trivy
  #
  #   Flow:
  #     Syft (image + source)
  #       └─ sbom.spdx.json  ──► Grype scan  ──► SARIF → Security tab
  #       └─ sbom.cdx.json   ──► Trivy scan  ──► SARIF → Security tab
  # ══════════════════════════════════════════════════════
  sbom-scan:
    name: SBOM scan (Syft → Grype + Trivy)
    runs-on: ubuntu-latest
    needs: build-and-scan-image
 
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
 
      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: zulu
          java-version: '11'
 
      - name: Build WAR (Maven)
        run: mvn clean package -DskipTests
 
      - name: Docker metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: calculator-webapp
          tags: |
            type=sha,format=short
 
      - name: Build Docker image
        uses: docker/build-push-action@v6
        with:
          context: .
          push: false
          tags: ${{ steps.meta.outputs.tags }}
 
      # ════════════════════════════════════════
      # STEP A — Generate SBOM with Syft
      # ════════════════════════════════════════
 
      # - name: Install Syft
      #   uses: anchore/sbom-action/download-syft@v0
 
      - uses: anchore/sbom-action@v0
        name: Syft — SBOM from image (SPDX JSON)
        with:
          image: ${{ steps.meta.outputs.tags }}
          format: spdx-json
          output-file: sbom.spdx.json

      # - name: Syft — SBOM from image (SPDX JSON)
      #   run: |
      #     syft ${{ steps.meta.outputs.tags }} \
      #       --output spdx-json="${GITHUB_WORKSPACE}/sbom.spdx.json"
      #     echo "✅ sbom.spdx.json written"
      #     jq '.packages | length' "${GITHUB_WORKSPACE}/sbom.spdx.json" \
      #       | xargs -I{} echo "Packages: {}"
 
      - uses: anchore/sbom-action@v0
        name: Syft — SBOM from source tree (SPDX JSON)
        with:
          path: .
          format: spdx-json
          output-file: sbom-src.spdx.json

      # - name: Syft — SBOM from source tree (SPDX JSON)
      #   run: |
      #     syft dir:"${GITHUB_WORKSPACE}" \
      #       --output spdx-json="${GITHUB_WORKSPACE}/sbom-src.spdx.json"
      #     echo "✅ sbom-src.spdx.json written"
 
      - name: Syft — convert to CycloneDX
        uses: anchore/sbom-action@v0
        with:
          image: ${{ steps.meta.outputs.tags }}
          format: cyclonedx-json
          output-file: sbom.cdx.json

        # run: |
        #   syft convert "${GITHUB_WORKSPACE}/sbom.spdx.json" \
        #     --output cyclonedx-json="${GITHUB_WORKSPACE}/sbom.cdx.json"
        #   echo "✅ sbom.cdx.json written"
 
      - name: SBOM summary
        run: |
          PKGS=$(jq '.packages | length' "${GITHUB_WORKSPACE}/sbom.spdx.json")
          echo "## SBOM Summary"                                  >> "$GITHUB_STEP_SUMMARY"
          echo "| | |"                                            >> "$GITHUB_STEP_SUMMARY"
          echo "|---|---|"                                         >> "$GITHUB_STEP_SUMMARY"
          echo "| Image | \`${{ steps.meta.outputs.tags }}\` |"  >> "$GITHUB_STEP_SUMMARY"
          echo "| Packages found | **$PKGS** |"                  >> "$GITHUB_STEP_SUMMARY"
          echo "| Formats | spdx-json, cyclonedx-json |"         >> "$GITHUB_STEP_SUMMARY"
 
      # ════════════════════════════════════════
      # STEP B — Scan SBOM with Grype
      #
      # Error-1 fix: the pre-cached Grype DB that ships
      # with anchore/scan-action/download-grype is 8 weeks
      # old. We force a fresh DB update with
      # GRYPE_DB_AUTO_UPDATE=true and
      # `grype db update` before scanning.
      #
      # Error-2 fix: because Grype failed (stale DB) the
      # SARIF file was never fully written → broken JSON.
      # Updating the DB first means the scan succeeds and
      # writes a complete SARIF.
      # ════════════════════════════════════════
 
      # - name: Install Grype
      #   uses: anchore/scan-action/download-grype@v7
 
      # - name: Grype — update vulnerability DB
      #   # Force download of the latest DB before scanning.
      #   # Without this, if the cached DB is >5 days old
      #   # Grype refuses to scan ("max allowed age is 5 days").
      #   env:
      #     GRYPE_DB_AUTO_UPDATE: "true"
      #   run: |
      #     grype db update
      #     grype db status

      - name: Scan SBOM
        uses: anchore/scan-action@v7
        with:
          sbom: sbom.spdx.json
          output-format: sarif
          output-file: grype.sarif
          fail-build: high
 
      # - name: Grype — scan SBOM → SARIF
      #   # No --fail-on here — Grype exits 0 so the full
      #   # SARIF is always written. Gate runs in Step E.
      #   env:
      #     GRYPE_DB_AUTO_UPDATE: "true"
      #   run: |
      #     grype sbom:"${GITHUB_WORKSPACE}/sbom.spdx.json" \
      #       --output sarif \
      #       --file "${GITHUB_WORKSPACE}/grype.sarif"
      #     echo "✅ grype.sarif written"
      #     ls -lh "${GITHUB_WORKSPACE}/grype.sarif"
 
      - name: Grype — validate SARIF
        run: |
          FILE="grype.sarif"
          if [ ! -f "$FILE" ]; then
            echo "❌ grype.sarif not found"; exit 1
          fi
          if [ ! -s "$FILE" ]; then
            echo "⚠️ grype.sarif empty — injecting minimal valid SARIF"
            printf '{"$schema":"https://json.schemastore.org/sarif-2.1.0.json","version":"2.1.0","runs":[{"tool":{"driver":{"name":"grype","rules":[]}},"results":[]}]}' \
              > "$FILE"
          fi
          jq empty "$FILE" && echo "✅ grype.sarif is valid JSON"
          jq '.runs[0].results | length' "$FILE" \
            | xargs -I{} echo "Grype findings: {}"
 
      - name: Grype — table report
        uses: anchore/scan-action@v7
        with:
          sbom: sbom.spdx.json
          output-format: table
          output-file: grype.sarif
        # env:
        #   GRYPE_DB_AUTO_UPDATE: "true"
        # run: |
        #   grype sbom:"${GITHUB_WORKSPACE}/sbom.spdx.json" \
        #     --output table \
        #     --file "${GITHUB_WORKSPACE}/grype-table.txt"
        #   echo "## Grype Results"                       >> "$GITHUB_STEP_SUMMARY"
        #   echo '```'                                    >> "$GITHUB_STEP_SUMMARY"
        #   cat "${GITHUB_WORKSPACE}/grype-table.txt"    >> "$GITHUB_STEP_SUMMARY"
        #   echo '```'                                    >> "$GITHUB_STEP_SUMMARY"
 
      - name: Grype — upload SARIF to Security tab
        uses: github/codeql-action/upload-sarif@v4
        if: always()
        with:
          sarif_file: grype.sarif
          category: grype-sbom
 
      # ════════════════════════════════════════
      # STEP C — Scan SBOM with Trivy
      #
      # Error-3 fix: aquasecurity/trivy-action resolves
      # `output:` relative to its own working directory,
      # NOT $GITHUB_WORKSPACE. We capture the output by
      # piping stdout to a file via shell instead of the
      # `output:` action input, guaranteeing we know
      # exactly where the file lands.
      # ════════════════════════════════════════
 
      - name: Trivy — scan SPDX SBOM → SARIF
        # Run Trivy action for SARIF but capture output
        # ourselves. exit-code 0 so the step never fails
        # before the file is written.
        uses: aquasecurity/trivy-action@master
        with:
          scan-type: sbom
          scan-ref: sbom.spdx.json
          format: sarif
          output: trivy-sbom.sarif
          severity: CRITICAL,HIGH,MEDIUM
          exit-code: '0'
 
      - name: Trivy — confirm SARIF was written
        # Double-check the action actually wrote the file.
        # If it didn't (action bug / path mismatch), find it.
        run: |
          TARGET="trivy-sbom.sarif"
          if [ ! -s "$TARGET" ]; then
            echo "⚠️ Not at expected path, searching workspace..."
            FOUND=$(find "${GITHUB_WORKSPACE}" -name "trivy-sbom.sarif" 2>/dev/null | head -1)
            if [ -n "$FOUND" ]; then
              echo "Found at: $FOUND — moving to $TARGET"
              mv "$FOUND" "$TARGET"
            else
              echo "Not found anywhere — re-running trivy directly to produce the file"
              # Fallback: run trivy binary the action already installed
              trivy sbom \
                --format sarif \
                --output "$TARGET" \
                --severity CRITICAL,HIGH,MEDIUM \
                --exit-code 0 \
                "sbom.spdx.json"
            fi
          fi
          ls -lh "$TARGET"
 
      - name: Trivy — validate SARIF
        run: |
          FILE="trivy-sbom.sarif"
          if [ ! -f "$FILE" ]; then
            echo "❌ trivy-sbom.sarif not found"; exit 1
          fi
          if [ ! -s "$FILE" ]; then
            echo "⚠️ trivy-sbom.sarif empty — injecting minimal valid SARIF"
            printf '{"$schema":"https://json.schemastore.org/sarif-2.1.0.json","version":"2.1.0","runs":[{"tool":{"driver":{"name":"trivy","rules":[]}},"results":[]}]}' \
              > "$FILE"
          fi
          jq empty "$FILE" && echo "✅ trivy-sbom.sarif is valid JSON"
          jq '.runs[0].results | length' "$FILE" \
            | xargs -I{} echo "Trivy findings: {}"
 
      - name: Trivy — scan CycloneDX SBOM → JSON
        uses: aquasecurity/trivy-action@master
        with:
          scan-type: sbom
          scan-ref: sbom.cdx.json
          format: json
          output: trivy-cdx.json
          severity: CRITICAL,HIGH,MEDIUM
          exit-code: '0'
 
      - name: Trivy — table report
        uses: aquasecurity/trivy-action@master
        with:
          scan-type: sbom
          scan-ref: sbom.spdx.json
          format: table
          severity: CRITICAL,HIGH,MEDIUM
          exit-code: '0'
 
      - name: Trivy — upload SARIF to Security tab
        uses: github/codeql-action/upload-sarif@v4
        if: always()
        with:
          sarif_file: trivy-sbom.sarif
          category: trivy-sbom
 
      # ════════════════════════════════════════
      # STEP D — Upload all reports (always)
      # ════════════════════════════════════════
      - name: Upload SBOM and scan reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: sbom-and-scan-reports
          retention-days: 30
          path: |
            ${{ github.workspace }}/sbom.spdx.json
            ${{ github.workspace }}/sbom-src.spdx.json
            ${{ github.workspace }}/sbom.cdx.json
            ${{ github.workspace }}/grype.sarif
            ${{ github.workspace }}/grype-table.txt
            ${{ github.workspace }}/trivy-sbom.sarif
            ${{ github.workspace }}/trivy-cdx.json
 
      # ════════════════════════════════════════
      # STEP E — Severity gates (always last so
      # artifacts are saved before any failure)
      # ════════════════════════════════════════
 
      # - name: Grype — severity gate (fail on HIGH+)
      #   env:
      #     GRYPE_DB_AUTO_UPDATE: "true"
      #   run: |
      #     grype sbom:"${GITHUB_WORKSPACE}/sbom.spdx.json" \
      #       --output table \
      #       --fail-on high

      - name: Grype — severity gate (fail on HIGH+)
        uses: anchore/scan-action@v7
        with:
          sbom: sbom.spdx.json
          output-format: table
          fail-build: high
 
      - name: Trivy — severity gate (fail on CRITICAL/HIGH)
        uses: aquasecurity/trivy-action@master
        with:
          scan-type: sbom
          scan-ref: sbom.spdx.json
          format: table
          severity: CRITICAL,HIGH
          exit-code: '1'